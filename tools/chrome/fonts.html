/* The two site faces, served from this origin instead of Google's font CDN.

   Four pages already did this and the other 75 did not, which meant most of
   the site opened two extra connections and waited on a render blocking
   stylesheet from another host before any text could be styled. These are the
   same files Google serves: the latin subset woff2 for each weight the design
   system uses, four of Unbounded and four of Space Grotesk. The two weights
   that paint the top of every page are preloaded above.

   The unicode-range is Google's own latin range, copied verbatim, and the
   fallback faces carry it too. That is deliberate: the files hold no glyph
   outside it, so the arrow, the four point star and the five point star used
   in the interface come from a system font. Without the range on the fallback
   faces those symbols would be drawn by Arial scaled up by size-adjust, which
   is a size change on a glyph that used to be left alone.

   The two -fb families are metric matched stand ins, drawn from whichever of
   four common system fonts the reader has, so a heading occupies the same
   space before the real face arrives as after. There is one face per weight
   because Unbounded's advance widths grow with weight while Arial's do not:
   a single size-adjust that suits 400 is 8 percent short at 900.

   Every size-adjust below was measured in a browser rather than derived, by
   rendering forty real headings and forty real paragraphs from this site in
   the real face and in the fallback and dividing. The ascent and descent
   overrides are each the true font metric divided by that size-adjust, which
   is what keeps the line box identical while the width is corrected.

   font-display:swap keeps text visible during the swap period, and the metric
   matching is what stops that swap moving anything. */
