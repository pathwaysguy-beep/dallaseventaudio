<script>
/* AV Concierge widget.

   Talks to the Cloudflare Worker that replaced the Wix http-function. The
   request and response shapes are unchanged from the Wix version: post a
   history array, get back reply, leadSaved and ended.

   Three decisions worth knowing about.

   The opening greeting is rendered locally rather than fetched. It is fixed
   text that the system prompt already specifies, so asking the model to
   produce it would spend a completion every time somebody clicks the pill out
   of curiosity. The same text is seeded into the history that gets sent, so
   the model sees a coherent transcript either way.

   Model replies are markdown and go through renderMarkdown below, which
   escapes every HTML metacharacter before it does any parsing. The reply is
   model output rather than authored markup, so nothing in it can become a live
   element or attribute.

   The conversation is kept in sessionStorage so moving between pages does not
   restart it. It is per tab and it disappears when the tab closes, which is
   the right lifetime for a sales chat.

   Since bundle 62 each conversation carries a random id, made on the first
   message and kept with the history, and each turn also names the page path
   it was sent from. The Worker keeps the conversation under that id so Steve
   gets a morning digest of what people asked and where they stopped. The id
   is not a cookie, is never reused across tabs, and the path is sent without
   its query string. */
(function () {
  'use strict';

  var ENDPOINT = 'https://dea-concierge.pathwaysguy.workers.dev/api/chat';
  /* After cutover, add the route www.dallaseventaudio.com/api/* to the Worker
     in the Cloudflare dashboard and change the line above to '/api/chat'. The
     request becomes same origin and CORS stops being involved at all. */

  var MAX_TURNS = 40;               /* mirrors the cap the Worker enforces */
  var STORE = 'dea-chat-v1';
  var FOLLOW = 'dea-chat-follow';   /* set when a chat link is followed */
  var GREETING =
    'Welcome to Dallas Event Audio 🎧 So I can help you the right ' +
    'way: which best describes you? Planning an event, a planner or ' +
    'coordinator sourcing for a client, a DJ, band or performer who needs us ' +
    'to set you up, or just have a question?';
  /* Tap-to-answer choices for the greeting's question. Clarity showed a phone
     visitor tapping the greeting over and over, reading the four choices as
     buttons, so now they are buttons. Each one sends its text as the visitor's
     first message, exactly as if it had been typed. */
  var CHOICES = ['Planning an event', 'Planner or coordinator',
    'DJ, band or performer', 'Just have a question'];
  var TROUBLE =
    'Sorry, I am having trouble connecting. Please call or text 817-210-7957.';

  var bubble = document.getElementById('chatBubble');
  var panel = document.getElementById('chatPanel');
  if (!bubble || !panel) return;

  var log = document.getElementById('chatLog');
  var input = document.getElementById('chatInput');
  var send = document.getElementById('chatSend');
  var close = document.getElementById('chatClose');

  var history = [];
  var busy = false;
  var ended = false;
  var sid = '';

  function newSid() {
    var out = '';
    try {
      var a = new Uint8Array(12);
      crypto.getRandomValues(a);
      for (var i = 0; i < a.length; i++) out += ('0' + a[i].toString(16)).slice(-2);
    } catch (e) {
      out = '';
      while (out.length < 24) out += Math.floor(Math.random() * 16).toString(16);
    }
    return out;
  }

  function pagePath() {
    try { return location.pathname.split('?')[0].slice(0, 200); } catch (e) { return '/'; }
  }

  /* ---- markdown, escaped first so model output can never become markup ---- */

  var ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  function esc(s) { return s.replace(/[&<>"']/g, function (c) { return ESC[c]; }); }

  var SAFE_SCHEME = /^(?:https?:|mailto:|tel:)/i;
  var SAFE_RELATIVE = /^\/(?!\/)/;
  function safeHref(h) { return SAFE_SCHEME.test(h) || SAFE_RELATIVE.test(h); }

  /* A link to a page of this site opens in the same window, and the chat
     reopens on that page with the conversation intact (see FOLLOW below).
     Anything off the site still opens in a new tab. */
  var OWN = /^https?:\/\/(?:www\.)?dallaseventaudio\.com(?=\/|$)/i;
  function inline(t) {
    var out = t.replace(/\[([^[\]]+)\]\(([^()\s]+)\)/g, function (w, label, href) {
      if (!safeHref(href)) return label;
      if (SAFE_RELATIVE.test(href) || OWN.test(href)) {
        return '<a href="' + href.replace(OWN, '') + '" data-own="1">' + label + '</a>';
      }
      return '<a href="' + href + '" target="_blank" rel="noopener noreferrer">' +
        label + '</a>';
    });
    out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    return out;
  }

  var BULLET = /^-\s+(.*)$/;
  var NUMBERED = /^(\d+)\.\s+(.*)$/;

  function block(b) {
    var lines = b.split('\n').map(function (l) { return l.trim(); });
    var allBullet = lines.every(function (l) { return BULLET.test(l); });
    var allNumber = lines.every(function (l) { return NUMBERED.test(l); });
    if (allBullet) {
      return '<ul>' + lines.map(function (l) {
        return '<li>' + inline(l.match(BULLET)[1]) + '</li>';
      }).join('') + '</ul>';
    }
    if (allNumber) {
      /* start comes from the number the model wrote, so a point split off into
         its own block by a blank line still reads as two rather than one. */
      var first = parseInt(lines[0].match(NUMBERED)[1], 10) || 1;
      return '<ol start="' + first + '">' + lines.map(function (l) {
        return '<li>' + inline(l.match(NUMBERED)[2]) + '</li>';
      }).join('') + '</ol>';
    }
    return '<p>' + lines.map(inline).join('<br>') + '</p>';
  }

  function renderMarkdown(text) {
    if (typeof text !== 'string' || !text.length) return '';
    return esc(text).replace(/\r\n/g, '\n')
      .split(/\n{2,}/)
      .map(function (b) { return b.trim(); })
      .filter(function (b) { return b.length; })
      .map(block)
      .join('\n');
  }

  /* ---- transcript ---- */

  function track(name, params) {
    try { if (typeof window.gtag === 'function') window.gtag('event', name, params || {}); }
    catch (e) {}
  }

  function paint(role, text) {
    var row = document.createElement('div');
    row.className = 'cp-msg' + (role === 'user' ? ' me' : '');
    var body = document.createElement('div');
    body.className = 'b';
    body.innerHTML = renderMarkdown(text);
    row.appendChild(body);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    return row;
  }

  function thinking(on) {
    var el = document.getElementById('cpDots');
    if (on && !el) {
      el = document.createElement('div');
      el.id = 'cpDots';
      el.className = 'cp-dots';
      el.innerHTML = '<i></i><i></i><i></i>';
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
    } else if (!on && el) {
      el.remove();
    }
  }

  function save() {
    try { sessionStorage.setItem(STORE, JSON.stringify({ history: history, ended: ended, sid: sid })); }
    catch (e) {}
  }

  function restore() {
    var raw = null;
    try { raw = sessionStorage.getItem(STORE); } catch (e) {}
    if (raw) {
      try {
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.history) && d.history.length) {
          history = d.history;
          ended = !!d.ended;
          if (typeof d.sid === 'string' && /^[a-f0-9]{16,40}$/.test(d.sid)) sid = d.sid;
        }
      } catch (e) {}
    }
    if (!history.length) history = [{ role: 'assistant', content: GREETING }];
    log.innerHTML = '';
    history.forEach(function (m) { paint(m.role, m.content); });
    if (ended) lock();
    quick();
  }

  function quick() {
    var old = document.getElementById('cpQuick');
    if (old) old.remove();
    if (ended || busy || history.length !== 1) return;
    var row = document.createElement('div');
    row.id = 'cpQuick';
    row.className = 'cp-quick';
    CHOICES.forEach(function (c) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = c;
      b.addEventListener('click', function () {
        input.value = c;
        track('chat_quick_reply', { event_category: 'concierge', choice: c });
        submit();
      });
      row.appendChild(b);
    });
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
  }

  /* iPhone keyboards. On a phone the panel is a sheet pinned to the bottom of
     the layout viewport, and iOS Safari does not shrink that viewport when the
     keyboard opens, so the keyboard could cover the input. visualViewport
     reports the part of the page the keyboard leaves visible; the sheet is
     lifted and capped to it whenever it changes. Desktop is left alone. */
  var vv = window.visualViewport;
  function fit() {
    if (panel.hidden || !vv || window.innerWidth > 520) {
      panel.style.bottom = '';
      panel.style.maxHeight = '';
      return;
    }
    var covered = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    panel.style.bottom = covered + 'px';
    panel.style.maxHeight = Math.round(vv.height * 0.92) + 'px';
    log.scrollTop = log.scrollHeight;
  }
  if (vv) {
    vv.addEventListener('resize', fit);
    vv.addEventListener('scroll', fit);
  }
  input.addEventListener('focus', function () { setTimeout(fit, 250); });
  input.addEventListener('blur', function () { setTimeout(fit, 250); });

  function lock() {
    input.disabled = true;
    send.disabled = true;
    input.placeholder = '';
  }

  /* ---- open and close ---- */

  var lastFocus = null;

  /* src says what opened the chat, for GA4: the pill (bubble), the header
     search bar (search) or a followed chat link (link). Click handlers pass
     an event object, which counts as the pill. */
  function open(src) {
    var source = typeof src === 'string' ? src : 'bubble';
    lastFocus = document.activeElement;
    panel.hidden = false;
    bubble.setAttribute('data-open', '1');
    bubble.setAttribute('aria-expanded', 'true');
    if (!log.childNodes.length) restore();
    log.scrollTop = log.scrollHeight;
    fit();
    /* No automatic focus on a phone: it pops the keyboard over the greeting
       and its choices before anyone has read them. */
    if (!ended && window.innerWidth > 520) input.focus();
    track('chat_open', { event_category: 'concierge', source: source });
  }

  function shut() {
    panel.hidden = true;
    bubble.removeAttribute('data-open');
    bubble.setAttribute('aria-expanded', 'false');
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  log.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a[data-own]') : null;
    if (!a) return;
    try { sessionStorage.setItem(FOLLOW, '1'); } catch (err) {}
    track('chat_link_click', { event_category: 'concierge', link_url: a.getAttribute('href') });
  });

  bubble.addEventListener('click', open);
  bubble.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
  });
  close.addEventListener('click', shut);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !panel.hidden) shut();
  });

  /* A visitor who followed a link inside the chat lands with it open. */
  var follow = null;
  try { follow = sessionStorage.getItem(FOLLOW); sessionStorage.removeItem(FOLLOW); } catch (e) {}
  if (follow === '1') open('link');

  /* The header search bar (bundle 120) hands a question over here, so the
     visitor lands in the same conversation the pill opens, with the question
     already sent. Returns false when the chat has ended or is busy, so the
     search bar can leave the question in place. */
  window.deaConcierge = {
    ask: function (text) {
      text = String(text || '').trim();
      if (!text) return false;
      open('search');
      if (busy || ended) return false;
      input.value = text;
      submit();
      return true;
    }
  };

  /* ---- sending ---- */

  input.addEventListener('input', function () {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
  });
  send.addEventListener('click', submit);

  function submit() {
    if (busy || ended) return;
    var text = input.value.trim();
    if (!text) return;

    input.value = '';
    input.style.height = 'auto';
    var q = document.getElementById('cpQuick');
    if (q) q.remove();
    if (!sid) sid = newSid();
    history.push({ role: 'user', content: text });
    paint('user', text);
    track('chat_message_sent', { event_category: 'concierge' });

    /* Keep the tail of a long conversation rather than letting the Worker
       refuse the whole thing at 40 turns. The greeting stays at the front so
       the model never loses the persona gate. */
    if (history.length > MAX_TURNS) {
      history = [history[0]].concat(history.slice(history.length - (MAX_TURNS - 1)));
    }

    busy = true;
    send.disabled = true;
    thinking(true);
    save();

    fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ history: history, sid: sid, page: pagePath() })
    })
      .then(function (r) { return r.json().catch(function () { return {}; }); })
      .then(function (d) {
        thinking(false);
        var reply = (d && d.reply) || TROUBLE;
        history.push({ role: 'assistant', content: reply });
        paint('assistant', reply);
        if (d && d.leadSaved) track('generate_lead', { event_category: 'concierge' });
        if (d && d.ended) { ended = true; lock(); }
        save();
      })
      .catch(function () {
        thinking(false);
        paint('assistant', TROUBLE);
      })
      .then(function () {
        busy = false;
        if (!ended) {
          send.disabled = false;
          if (window.innerWidth > 520 || document.activeElement === input) input.focus();
        }
      });
  }
})();
/* Header search bar (bundle 120).

   One field, two jobs. As the visitor types, it suggests matching pages from
   /search-index.json (built by tools/build_search_index.py from sitemap.xml:
   title, H1, description, category and menu label, about 28 KB, fetched the
   first time search opens or the button is hovered). The last row hands the
   question to the AV Concierge through window.deaConcierge, so it lands in
   the same conversation the chat pill opens.

   Enter follows the highlighted row. Short searches ("uplighting", "cdj")
   highlight the best page; anything that reads like a question, or finds no
   page, highlights the concierge row. Arrow keys move the highlight, Escape
   closes, and the slash key opens search from anywhere on the page.

   GA4: search_open; search_result_click (search_term, link_url, position);
   search_ask (search_term). Search terms are trimmed to 100 characters with
   email addresses and phone-like numbers replaced, so nothing personal goes
   to Analytics. Kept inside this script element on purpose: sync_chrome.py
   finds the shared scripts by what they contain, and a separate element here
   would stack on every sync. */
(function () {
  'use strict';
  var btn = document.getElementById('srchBtn');
  if (!btn) return;

  var CALM = document.body && document.body.classList.contains('calm');
  var EXAMPLES = ['Search pages or ask a question',
    'Low fog for a first dance?', 'Projector for 200 people?',
    'How many speakers for a wedding?', 'Uplighting in our colors?',
    'CDJ-3000 rental'];
  var POPULAR = [['Dancing on the Clouds', '/rent-dancing-on-the-clouds-low-lyin'],
    ['Projector and Screen', '/projector-screen-rental'], ['Sound Rental', '/rent-sound-equipment'],
    ['Uplighting', '/rent-uplighting'], ['DJ Services', '/services-dj'],
    ['Venues We\'ve Worked', '/venues']];
  var ASK_IDEAS = ['How many speakers do I need for 200 guests?',
    'Can you do low fog for our first dance?',
    'What do I need for a corporate presentation?'];
  var STOP = { a: 1, an: 1, the: 1, and: 1, or: 1, for: 1, of: 1, to: 1, in: 1, on: 1,
    my: 1, our: 1, me: 1, i: 1, we: 1, you: 1, do: 1, does: 1, can: 1, is: 1, are: 1,
    rent: 1, rental: 1, rentals: 1, dallas: 1, fort: 1, worth: 1, dfw: 1, near: 1,
    how: 1, what: 1, which: 1, who: 1, when: 1, where: 1, why: 1, will: 1, would: 1,
    should: 1, could: 1, need: 1, needs: 1, get: 1, have: 1, has: 1, much: 1, many: 1,
    it: 1, its: 1, be: 1, with: 1, at: 1, from: 1, any: 1, some: 1, people: 1, guests: 1,
    guest: 1, event: 1, events: 1, help: 1, please: 1, us: 1, your: 1, about: 1 };
  var SYN = {
    fog: ['fog', 'haze', 'clouds', 'dry ice'], cloud: ['clouds', 'dry ice', 'fog'],
    ice: ['dry ice', 'clouds'], smoke: ['fog', 'haze'], haze: ['haze', 'fog'],
    light: ['lighting', 'uplighting'], uplight: ['uplighting'], uplighting: ['uplighting'],
    sound: ['sound', 'speaker', 'audio'], speaker: ['speaker', 'sound'], pa: ['sound', 'speaker'],
    audio: ['audio', 'sound'], sub: ['subwoofer', 'bassboss'], bass: ['subwoofer', 'bassboss'],
    projector: ['projector', 'screen'], screen: ['screen', 'projector'], projection: ['projector'],
    tv: ['tv'], television: ['tv'], mic: ['microphone'], microphone: ['microphone'],
    dj: ['dj'], cdj: ['cdj'], turntable: ['cdj', 'dj'], laser: ['laser'],
    wedding: ['wedding'], bride: ['wedding'], corporate: ['corporate'], conference: ['corporate', 'conference'],
    meeting: ['corporate', 'meeting'], stream: ['streaming'], streaming: ['streaming'],
    livestream: ['streaming'], party: ['private', 'party'], band: ['band', 'live music'],
    rave: ['rave', 'club'], club: ['club', 'rave'], monogram: ['monogram'], gobo: ['monogram'],
    spotlight: ['follow spot'], spot: ['follow spot'], venue: ['venues', 'venue'],
    quote: ['quote', 'contact'], price: ['quote', 'contact'], cost: ['cost', 'quote'],
    review: ['reviews'], photo: ['photo', 'gallery'], video: ['video', 'projector', 'streaming'],
    school: ['college', 'school'], college: ['college', 'university'], graduation: ['college', 'school']
  };
  var QWORDS = /^(how|what|which|who|when|where|why|can|could|do|does|did|is|are|will|would|should|need|i|we|my|our)\b/i;

  var wrap = null, input = null, list = null, rows = [], sel = -1, index = null, loading = null;
  var phTimer = null, phIdx = 0, lastFocus = null, locked = false;

  function track(name, params) {
    try { if (typeof window.gtag === 'function') window.gtag('event', name, params || {}); } catch (e) {}
  }
  function term(q) {
    return String(q || '').replace(/\S+@\S+/g, '[email]')
      .replace(/\+?\d[\d\s().-]{6,}\d/g, '[number]').trim().slice(0, 100);
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function load() {
    if (index) return Promise.resolve(index);
    if (loading) return loading;
    loading = fetch('/search-index.json').then(function (r) { return r.json(); })
      .then(function (d) {
        index = (Array.isArray(d) ? d : []).map(function (p) {
          return { u: p.u, t: p.t || '', d: p.d || '', c: p.c || '',
            lead: [p.k, p.t].join(' ').toLowerCase(),
            hay: [p.t, p.h, p.k, p.d, p.u.replace(/[\/-]/g, ' ')].join(' ').toLowerCase(),
            top: [p.t, p.k, p.u.replace(/[\/-]/g, ' ')].join(' ').toLowerCase() };
        });
        return index;
      })
      .catch(function () { loading = null; index = null; return []; });
    return loading;
  }

  function tokens(q) {
    return q.toLowerCase().replace(/[^a-z0-9\s-]/g, ' ').split(/\s+/).filter(function (w) {
      return w && !STOP[w] && !/^\d+$/.test(w);
    });
  }
  function terms(w) {
    var base = w.length > 3 && /s$/.test(w) ? w.slice(0, -1) : w;
    return (SYN[base] || SYN[w] || []).concat([w, base]);
  }
  function rank(q) {
    if (!index) return [];
    var ws = tokens(q);
    if (!ws.length) return [];
    var scored = index.map(function (p) {
      var s = 0, hits = 0;
      ws.forEach(function (w) {
        var best = 0;
        terms(w).forEach(function (t) {
          if (t.length < 2) return;
          var re = new RegExp('(^|[^a-z0-9])' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
          var lead = new RegExp('^' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
          if (lead.test(p.lead) || lead.test(p.t.toLowerCase())) best = Math.max(best, t === w ? 8 : 7);
          else if (re.test(p.top)) best = Math.max(best, t === w ? 6 : 5);
          else if (re.test(p.hay)) best = Math.max(best, t === w ? 3 : 2);
        });
        if (best) { hits++; s += best; }
      });
      if (!s) return null;
      s = s * (0.6 + 0.4 * hits / ws.length);
      if (p.c === 'Guide') s *= 0.7;
      else if (p.c === 'Info') s *= 0.85;
      return { p: p, s: s };
    }).filter(Boolean).sort(function (a, b) { return b.s - a.s; });
    if (!scored.length) return [];
    var cut = scored[0].s * 0.5;
    return scored.filter(function (x) { return x.s >= cut; }).slice(0, 6).map(function (x) { return x.p; });
  }
  function isQuestion(q) {
    return /\?/.test(q) || q.trim().split(/\s+/).length >= 4 || QWORDS.test(q.trim());
  }

  function build() {
    if (wrap) return;
    wrap = document.createElement('div');
    wrap.id = 'srchWrap';
    wrap.hidden = true;
    wrap.innerHTML =
      '<div class="srch-scrim"></div>' +
      '<div class="srch-box" role="dialog" aria-modal="true" aria-label="Search or ask">' +
      '<div class="srch-field"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5L20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>' +
      '<input class="srch-input" id="srchInput" type="search" role="combobox" aria-autocomplete="list" aria-expanded="true" aria-controls="srchList" autocomplete="off" spellcheck="false" enterkeyhint="go" aria-label="Search the site or ask the AV Concierge">' +
      '<button type="button" class="srch-close" aria-label="Close search"><span class="k-desk">Esc</span><span class="k-mob">Close</span></button></div>' +
      '<div class="srch-list" id="srchList" role="listbox" aria-label="Suggestions"></div>' +
      '<div class="srch-foot">Pick a page, or ask the AV Concierge anything about your event.</div>' +
      '</div>';
    document.body.appendChild(wrap);
    input = wrap.querySelector('.srch-input');
    list = wrap.querySelector('.srch-list');
    wrap.querySelector('.srch-scrim').addEventListener('click', shut);
    wrap.querySelector('.srch-close').addEventListener('click', shut);
    input.addEventListener('input', function () { render(); });
    input.addEventListener('keydown', key);
    list.addEventListener('mousemove', function (e) {
      var r = e.target.closest ? e.target.closest('[data-i]') : null;
      if (r) select(+r.getAttribute('data-i'));
    });
    list.addEventListener('click', function (e) {
      var r = e.target.closest ? e.target.closest('[data-i],[data-ask]') : null;
      if (!r) return;
      if (r.hasAttribute('data-ask')) { e.preventDefault(); ask(r.getAttribute('data-ask')); return; }
      go(+r.getAttribute('data-i'), e);
    });
  }

  function select(i) {
    sel = i;
    rows.forEach(function (r, n) { r.el.setAttribute('aria-selected', n === i ? 'true' : 'false'); });
    if (rows[i]) {
      input.setAttribute('aria-activedescendant', rows[i].el.id);
      if (rows[i].el.scrollIntoView) rows[i].el.scrollIntoView({ block: 'nearest' });
    } else {
      input.removeAttribute('aria-activedescendant');
    }
  }

  function render() {
    var q = input.value.trim();
    rows = [];
    var html = '';
    if (!q) {
      html += '<div class="srch-sec">Popular pages</div><div class="srch-chips">' +
        POPULAR.map(function (p) { return '<a class="srch-chip" href="' + p[1] + '" data-pop="1">' + esc(p[0]) + '</a>'; }).join('') + '</div>';
      if (!CALM) {
        html += '<div class="srch-sec">Or ask the AV Concierge</div><div class="srch-chips">' +
          ASK_IDEAS.map(function (a) { return '<button type="button" class="srch-chip q" data-ask="' + esc(a) + '">' + esc(a) + '</button>'; }).join('') + '</div>';
      }
      list.innerHTML = html;
      select(-1);
      return;
    }
    var found = rank(q);
    found.forEach(function (p, i) {
      html += '<a class="srch-row" role="option" id="srchOpt' + i + '" data-i="' + i + '" href="' + esc(p.u) + '">' +
        '<span class="srch-txt"><span class="srch-t">' + esc(p.t) + '</span><span class="srch-d">' + esc(p.d) + '</span></span>' +
        '<span class="srch-c">' + esc(p.c) + '</span><span class="srch-enter" aria-hidden="true">Enter</span></a>';
    });
    if (!found.length && !index) html += '<div class="srch-sec">Loading pages</div>';
    else if (!found.length) html += '<div class="srch-sec">No page matches that yet</div>';
    if (!CALM) {
      var n = found.length;
      html += '<button type="button" class="srch-row srch-ask" role="option" id="srchOpt' + n + '" data-i="' + n + '" data-askrow="1">' +
        '<span class="srch-spark" aria-hidden="true">&#10022;</span>' +
        '<span class="srch-txt"><span class="srch-t">Ask the AV Concierge</span><span class="srch-d">&ldquo;' + esc(q) + '&rdquo;</span></span>' +
        '<span class="srch-enter" aria-hidden="true">Enter</span></button>';
    }
    list.innerHTML = html;
    Array.prototype.forEach.call(list.querySelectorAll('[data-i]'), function (el) {
      rows.push({ el: el, ask: el.hasAttribute('data-askrow'), u: el.getAttribute('href') });
    });
    var askIdx = CALM ? -1 : found.length;
    select(found.length && !isQuestion(q) ? 0 : (askIdx >= 0 ? askIdx : 0));
  }

  function key(e) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (!rows.length) return;
      e.preventDefault();
      var n = sel + (e.key === 'ArrowDown' ? 1 : -1);
      if (n < 0) n = rows.length - 1;
      if (n >= rows.length) n = 0;
      select(n);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      var q = input.value.trim();
      if (!q) return;
      if (rows[sel]) go(sel);
      else if (!CALM) ask(q);
    } else if (e.key === 'Escape') {
      e.preventDefault();
      shut();
    }
  }

  function go(i, e) {
    var r = rows[i];
    if (!r) return;
    if (r.ask) { if (e) e.preventDefault(); ask(input.value.trim()); return; }
    track('search_result_click', { search_term: term(input.value), link_url: r.u, position: i + 1, transport_type: 'beacon' });
    if (!e) location.href = r.u;
  }

  function ask(q) {
    q = String(q || '').trim();
    if (!q) return;
    track('search_ask', { search_term: term(q) });
    shut(true);
    if (window.deaConcierge && window.deaConcierge.ask(q)) return;
    location.href = '/contact#quote-form';
  }

  function cycle() {
    clearInterval(phTimer);
    phIdx = 0;
    input.placeholder = EXAMPLES[0];
    phTimer = setInterval(function () {
      if (input.value) return;
      phIdx = (phIdx + 1) % EXAMPLES.length;
      input.placeholder = EXAMPLES[phIdx];
    }, 2600);
  }

  function place() {
    var h = document.querySelector('header');
    var top = h ? Math.max(0, h.getBoundingClientRect().bottom) : 0;
    var box = wrap.querySelector('.srch-box');
    box.style.top = (top + 10) + 'px';
    list.style.maxHeight = Math.max(200, window.innerHeight - top - 150) + 'px';
  }

  function openSearch() {
    build();
    lastFocus = document.activeElement;
    wrap.hidden = false;
    btn.setAttribute('aria-expanded', 'true');
    if (!document.body.classList.contains('nav-locked')) {
      document.body.classList.add('srch-locked');
      locked = true;
    }
    place();
    render();
    cycle();
    input.focus();
    track('search_open', {});
    load().then(function () { if (!wrap.hidden) render(); });
  }

  function shut(keepFocus) {
    if (!wrap || wrap.hidden) return;
    wrap.hidden = true;
    clearInterval(phTimer);
    btn.setAttribute('aria-expanded', 'false');
    if (locked) { document.body.classList.remove('srch-locked'); locked = false; }
    if (keepFocus !== true && lastFocus && lastFocus.focus) lastFocus.focus();
  }

  btn.addEventListener('click', openSearch);
  btn.addEventListener('pointerenter', load);
  btn.addEventListener('focus', load);
  window.addEventListener('resize', function () { if (wrap && !wrap.hidden) place(); });
  document.addEventListener('keydown', function (e) {
    if (e.key !== '/' || e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;
    if (wrap && !wrap.hidden) return;
    e.preventDefault();
    openSearch();
  });
})();
</script>
