<script>
  // Palette dock, bottom left
  (function(){
    const dock = document.getElementById('paletteBar');
    const toggle = document.getElementById('palToggle');
    const opts = Array.prototype.slice.call(document.querySelectorAll('#palOpts button'));
    if(!dock || !toggle) return;

    function store(v){ try{ window.localStorage.setItem('dea-palette', v); }catch(e){} }
    function recall(){ try{ return window.localStorage.getItem('dea-palette'); }catch(e){ return null; } }

    function apply(p){
      document.documentElement.setAttribute('data-palette', p);
      opts.forEach(b=>{
        const on = b.dataset.p === p;
        b.classList.toggle('active', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    }

    const saved = recall();
    if(saved && opts.some(b=>b.dataset.p === saved)) apply(saved);

    function open(state){
      dock.classList.toggle('open', state);
      toggle.setAttribute('aria-expanded', state ? 'true' : 'false');
    }
    /* Usage tracking, added 22 October 2026: the dock stays on the site as a
       playful extra, so record how often visitors open it and which palette
       they pick. GA4 gets palette_open and palette_change (with the palette
       name and page), and Clarity gets the same two names as custom events so
       its recordings can be filtered to people who played with it. Both calls
       are guarded, because gtag only transports on production and clarity
       only exists there. */
    function track(name, params){
      try{ if(typeof window.gtag === 'function') window.gtag('event', name, params); }catch(e){}
      try{ if(typeof window.clarity === 'function') window.clarity('event', name); }catch(e){}
    }
    toggle.addEventListener('click', e=>{
      e.stopPropagation();
      const opening = !dock.classList.contains('open');
      open(opening);
      if(opening) track('palette_open', { page_path: location.pathname });
    });
    opts.forEach(b=>{
      b.addEventListener('click', ()=>{
        apply(b.dataset.p); store(b.dataset.p); open(false);
        track('palette_change', { palette: b.dataset.p, page_path: location.pathname });
      });
    });
    document.addEventListener('click', e=>{ if(!dock.contains(e.target)) open(false); });
    document.addEventListener('keydown', e=>{ if(e.key === 'Escape') open(false); });
  })();

  // Scroll reveal
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    const io = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
    }, {threshold:.15});
    document.querySelectorAll('[data-reveal]').forEach(el=>io.observe(el));
  } else {
    document.querySelectorAll('[data-reveal]').forEach(el=>el.classList.add('in'));
  }

  // CO2 / particle burst on primary CTA click
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function burst(x, y){
    if(reduceMotion) return;
    const colors = ['var(--a1)','var(--a2)','var(--a3)','#ffffff'];
    const count = 26;
    for(let i=0;i<count;i++){
      const p = document.createElement('span');
      p.className = 'burst-particle';
      const angle = (Math.PI * 2 * i) / count + Math.random()*0.4;
      const dist = 60 + Math.random()*140;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist - 40;
      const size = 4 + Math.random()*6;
      p.style.width = p.style.height = size + 'px';
      p.style.background = colors[i % colors.length];
      p.style.boxShadow = '0 0 8px ' + colors[i % colors.length];
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      document.body.appendChild(p);
      const anim = p.animate([
        { transform:'translate(-50%,-50%) scale(1)', opacity:1 },
        { transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0.3)`, opacity:0 }
      ], { duration:700 + Math.random()*400, easing:'cubic-bezier(.2,.7,.3,1)' });
      anim.onfinish = () => p.remove();
    }
  }
  document.querySelectorAll('.btn-primary').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      burst(e.clientX, e.clientY);
    });
  });
</script>
