<script>
/* Google Analytics 4 and Google Ads, for the whole site, from one file.

   Before this, the tags lived inline on /contact and /thank-you only. 37 pages
   had no GA4 at all, so landing page attribution did not exist, and the Google
   Ads conversion is a GA4 import which means the number the bidding runs on was
   built from two pages.

   Two things are deliberate here.

   The hostname guard fires nothing anywhere except the production domain. The
   pages.dev preview, a local file, and every headless QA run are all silent.
   Without it, putting the tag on 41 pages would multiply the preview traffic
   already polluting the property by roughly twenty.

   window.gtag is defined even when the guard blocks, because the page specific
   conversion events on /contact and /thank-you call it. They check
   typeof gtag === 'function' and would silently stop working otherwise. With
   gtag defined, those calls queue into a dataLayer that is never transported,
   which is exactly the intended no-op off production.

   The loader is appended by script rather than written into the markup, so no
   request to googletagmanager.com happens off the production domain. Injected
   into the head by tools/sync_chrome.py, ahead of any body script calling gtag.

   Do not write literal tag syntax in this comment. The build tooling reads the
   file as text and counts tags, and a mention of one in prose breaks the
   balance assertions. This is the third time that has bitten. */
(function () {
  var PROD = ['www.dallaseventaudio.com', 'dallaseventaudio.com'];
  var GA4 = 'G-5SVH2Y4BDS';
  var ADS = 'AW-966108887';

  window.dataLayer = window.dataLayer || [];
  function gtag() { window.dataLayer.push(arguments); }
  window.gtag = gtag;

  if (PROD.indexOf(location.hostname) === -1) return;

  var s = document.createElement('script');
  s.async = true;
  s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA4;
  document.head.appendChild(s);

  gtag('js', new Date());
  gtag('config', GA4);
  gtag('config', ADS);
})();

/* Contact click tracking.

   Wix reported phone clicks, email clicks and WhatsApp clicks as a site total.
   GA4 does not do this on its own: enhanced measurement counts outbound clicks
   only for http and https links to another host, and tel, mailto and sms are
   all excluded. So the site has to send the event itself.

   One delegated listener on the document, rather than a handler per link. There
   are 301 tel links and 80 mailto links across 79 pages, and per link binding
   would miss anything the nav drawer or the chat widget adds after load.

   Every event carries the page it happened on, which is the part Wix could not
   answer: a phone click is worth knowing about, a phone click from
   /rent-line-array-speaker-system is worth bidding on.

   The same hostname guard is repeated below. The loader guard alone would have
   been enough to stop anything reaching the network, because gtag is left
   defined but untransported off production. It would not have stopped the
   listener binding and pushing into a dataLayer nobody drains, which grows for
   as long as a preview tab is open and reads, to anyone inspecting it, like
   events are being collected. Guarding the listener too costs one line and
   makes the preview genuinely inert.

   One page is not covered by this and should stay that way. davidsbridalfrisco
   is excluded from the chrome sync and carries its own tap tracking under the
   event names call_tap and text_tap. It is a live Google Ads landing page, so
   renaming its events to match could break an Ads conversion import. Any GA4
   report that wants the whole site has to union contact_click with call_tap.

   Do not write literal tag syntax in this comment. */
(function () {
  var PROD = ['www.dallaseventaudio.com', 'dallaseventaudio.com'];
  if (PROD.indexOf(location.hostname) === -1) return;

  var METHOD = { 'tel:': 'phone', 'mailto:': 'email', 'sms:': 'sms' };

  function scheme(href) {
    var i = href.indexOf(':');
    return i === -1 ? '' : href.slice(0, i + 1).toLowerCase();
  }

  function section(el) {
    var n = el;
    while (n && n !== document.body) {
      if (n.id) return n.id;
      if (n.getAttribute && n.getAttribute('data-section')) {
        return n.getAttribute('data-section');
      }
      n = n.parentNode;
    }
    return '';
  }

  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest && e.target.closest('a[href]');
    if (!a) return;

    var raw = a.getAttribute('href') || '';
    var m = METHOD[scheme(raw)];
    if (!m) return;

    var label = (a.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 80);

    gtag('event', 'contact_click', {
      contact_method: m,
      contact_target: raw.slice(0, 100),
      link_text: label,
      page_path: location.pathname,
      link_section: section(a),
      transport_type: 'beacon'
    });
  }, true);
})();
</script>
