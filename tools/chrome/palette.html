<div id="paletteBar">
    <div class="pal-opts" id="palOpts" role="group" aria-label="Color palette">
      <div class="pal-head">Color palette</div>
      <button type="button" data-p="signal" class="active" aria-pressed="true"><i class="sw-signal"></i>Signal Chain</button>
      <button type="button" data-p="amber" aria-pressed="false"><i class="sw-amber"></i>Stage Black &amp; Amber</button>
      <button type="button" data-p="night" aria-pressed="false"><i class="sw-night"></i>DFW Night Rig</button>
    </div>
    <button type="button" class="pal-toggle" id="palToggle" aria-expanded="false" aria-controls="palOpts">
      <span class="dots"><i style="background:#31ff6e"></i><i style="background:#fff21c"></i><i style="background:#ff1f3d"></i></span>
      <span class="label">Palette</span>
    </button>
  </div>
