<script>
/* Mobile navigation drawer. Added 5 Aug 2026 - before this, nav links simply
   vanished below 860px with nothing to replace them. */
(function(){
  var burger = document.getElementById('navBurger');
  var drawer = document.getElementById('navDrawer');
  var closeb = document.getElementById('navClose');
  if(!burger || !drawer) return;

  function open(){
    drawer.classList.add('open');
    drawer.setAttribute('aria-hidden','false');
    burger.setAttribute('aria-expanded','true');
    document.body.classList.add('nav-locked');
  }
  function close(){
    drawer.classList.remove('open');
    drawer.setAttribute('aria-hidden','true');
    burger.setAttribute('aria-expanded','false');
    document.body.classList.remove('nav-locked');
  }
  burger.addEventListener('click', open);
  if(closeb) closeb.addEventListener('click', close);
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && drawer.classList.contains('open')) close();
  });
  drawer.querySelectorAll('a[href]').forEach(function(a){
    a.addEventListener('click', function(){
      var h = a.getAttribute('href') || '';
      if(h.charAt(0) === '#') close();
    });
  });
  drawer.querySelectorAll('.nd-sec > button.nd-trig').forEach(function(btn){
    btn.addEventListener('click', function(){
      var sec = btn.parentNode;
      var isOpen = sec.classList.toggle('open');
      btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
  });

  /* Desktop dropdowns: hover and focus are handled in CSS. Keyboard users get
     Enter/Space to pin a menu open, Escape to release it. */
  document.querySelectorAll('.nl-item > .nl-top').forEach(function(top){
    top.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        var menu = top.parentNode.querySelector('.nl-menu a');
        if(menu) menu.focus();
      }
    });
  });
})();
/* Phone links on a computer. A tel: link does nothing on most desktops, and
   Clarity logged those clicks as dead clicks (28 Oct 2026). With a mouse, a
   click on any phone link copies the number and shows a short note instead.
   Touch screens keep tap-to-call. GA4 records the desktop case as
   contact_method phone_copy and does not send call_tap, so the Google Ads
   call conversion stays phone taps only. */
(function(){
  if(!window.matchMedia || !matchMedia('(hover: hover) and (pointer: fine)').matches) return;
  var note;
  function show(msg){
    if(!note){
      note = document.createElement('div');
      note.className = 'tel-note';
      note.setAttribute('role','status');
      document.body.appendChild(note);
    }
    note.textContent = msg;
    note.classList.add('on');
    clearTimeout(note._t);
    note._t = setTimeout(function(){ note.classList.remove('on'); }, 4000);
  }
  document.addEventListener('click', function(e){
    var a = e.target && e.target.closest && e.target.closest('a[href^="tel:"]');
    if(!a) return;
    e.preventDefault();
    var num = '817-210-7957';
    var done = function(){ show(num + ' copied. Call or text us anytime.'); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(num).then(done, function(){ show('Call or text us at ' + num + '.'); });
    } else { show('Call or text us at ' + num + '.'); }
  });
})();
/* Pause looping animations while they are off screen (bundle 118).
   The hero grid, lasers and fog, the city banner, the chat typing dots and the
   page-specific loops (fog drift, beams, wavefronts) all run forever, and the
   browser keeps repainting them after the visitor has scrolled past. After
   load, every infinite animation on the page is found once, its element is
   watched, and the animation pauses when the element leaves the screen and
   resumes when it comes back. Nothing looks different to a visitor. Anything
   turned off by prefers-reduced-motion or by the phone rules has no running
   animation, so it is skipped automatically. Kept inside this script element
   on purpose: tools/sync_chrome.py finds the shared scripts by what they
   contain, and a separate element here would stack on every sync. */
(function(){
  if(!('IntersectionObserver' in window) || !document.getAnimations) return;
  function start(){
    var map = new Map();
    document.getAnimations().forEach(function(a){
      var t = a.effect && a.effect.target;
      var timing = a.effect && a.effect.getComputedTiming && a.effect.getComputedTiming();
      if(!t || !timing || timing.iterations !== Infinity) return;
      if(!map.has(t)) map.set(t, []);
      map.get(t).push(a);
    });
    if(!map.size) return;
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        (map.get(e.target) || []).forEach(function(a){
          try{ if(e.isIntersecting) a.play(); else a.pause(); }catch(err){}
        });
      });
    }, { rootMargin:'100px 0px' });
    map.forEach(function(list, el){ io.observe(el); });
  }
  if(document.readyState === 'complete') start();
  else window.addEventListener('load', start);
})();
</script>
